---
name: Dependency installation

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-dependencies:
    name: test-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pin@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies with SHA256 verification
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Verify vulnerable dependency versions and client imports
        run: |
          python - <<'PY'
          from importlib.metadata import version

          from github import Github

          assert version("certifi") == "2026.10.23"
          assert version("PyJWT") == "2.15.1"
          assert version("urllib3") == "2.8.0"
          assert Github is not None
          print("Pinned dependencies and PyGithub import verified.")
          PY
